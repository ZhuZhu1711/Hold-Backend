<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
        }
        h2 { color: #333; font-weight: 600; text-align: center; }
        .sub {
            color: #666; font-size: 14px; margin: 8px 0 16px; text-align: center; line-height: 1.5;
        }
        .account {
            background: #f6f3fb;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        .account-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #333;
            line-height: 1.8;
        }
        .account-row + .account-row { margin-top: 2px; }
        .account-row span { color: #888; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; margin-bottom: 8px; color: #333; font-size: 14px; font-weight: 500;
        }
        .form-group input {
            width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px;
        }
        .form-group input:focus {
            outline: none; border-color: #764ba2; box-shadow: 0 0 5px rgba(118, 75, 162, 0.2);
        }
        .btn {
            width: 100%; padding: 12px; background: #764ba2; color: white; border: none;
            border-radius: 5px; font-size: 16px; cursor: pointer;
        }
        .btn:hover { background: #5b3a7d; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .hint { font-size: 12px; color: #888; margin-top: 4px; }
        .error-msg { color: #ff4d4d; font-size: 14px; text-align: center; margin-top: 15px; min-height: 20px; }
        .logout {
            display: block; text-align: center; margin-top: 16px; color: #666; font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>修改密码</h2>
        <p class="sub">
            {% if must_change %}首次（或按要求）登录后须更新密码，之后才能进入后台。{% endif %}
            密码须同时包含字母和数字，至少 6 位，不能与工号相同。
        </p>
        <div class="account">
            <div class="account-row"><span>用户名</span><strong>{{ user_name or '-' }}</strong></div>
            <div class="account-row"><span>工号</span><strong>{{ employee_no or '-' }}</strong></div>
        </div>
        <form id="changeForm">
            <div class="form-group">
                <label for="old_password">原密码</label>
                <input type="password" id="old_password" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" required autocomplete="new-password" minlength="6">
                <p class="hint">字母 + 数字，至少 6 位</p>
            </div>
            <div class="form-group">
                <label for="confirm_password">确认新密码</label>
                <input type="password" id="confirm_password" required autocomplete="new-password" minlength="6">
            </div>
            <button type="submit" class="btn" id="submitBtn">保存新密码</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
        <a class="logout" href="/logout">退出登录</a>
    </div>
    <script>
        const employeeNo = {{ (employee_no or '')|tojson }};
        document.getElementById('changeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');
            const oldPassword = document.getElementById('old_password').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            errorMsg.style.color = '#ff4d4d';
            if (newPassword.length < 6) {
                errorMsg.textContent = '密码至少 6 位';
                return;
            }
            if (!/[A-Za-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                errorMsg.textContent = '密码须同时包含字母和数字';
                return;
            }
            if (employeeNo && newPassword.toLowerCase() === String(employeeNo).toLowerCase()) {
                errorMsg.textContent = '密码不能与工号相同';
                return;
            }
            if (newPassword !== confirmPassword) {
                errorMsg.textContent = '两次输入的新密码不一致';
                return;
            }
            btn.disabled = true;
            errorMsg.textContent = '';
            fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            })
            .then(r => r.json())
            .then(data => {
                btn.disabled = false;
                if (data.code === 200) {
                    errorMsg.style.color = 'green';
                    errorMsg.textContent = '密码已修改，正在进入系统...';
                    const redirect = (data.data && data.data.redirect) || '/';
                    setTimeout(() => { window.location.href = redirect; }, 500);
                } else {
                    errorMsg.textContent = data.msg || '修改失败';
                }
            })
            .catch(() => {
                btn.disabled = false;
                errorMsg.textContent = '网络错误，请稍后重试';
            });
        });
    </script>
</body>
</html>
