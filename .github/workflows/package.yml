name: Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Stage artifact
        shell: pwsh
        run: |
          if (-not (Test-Path dist/HoldBackend.exe)) {
            throw "missing dist/HoldBackend.exe"
          }
          Compress-Archive -Path dist/HoldBackend.exe -DestinationPath dist/HoldBackend-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoldBackend-windows
          path: dist/HoldBackend-windows.zip
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HoldBackend-windows.zip
